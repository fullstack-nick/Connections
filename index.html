        <hr>
    </header>
    <main>
        <div class="intro-text" id="intro-text">Please wait for the words to load...</div>
        <section class="words-board none" id="words-board">
            <!-- <div class="solved">
                <h3 class="solved-category">CATEGORY NAME</h3>

            </div> -->

            <script>
                // for (let i = 0; i < 4; i++) {

            <i class="fa-solid fa-circle" id="mistake-4"></i>

        <div class="buttons" id="buttons">
            <button class="button" id="shuffle">Shuffle</button>

            <button class="button pale" id="submit">Submit</button>
